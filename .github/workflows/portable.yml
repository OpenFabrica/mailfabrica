name: Go desktop checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, 'feat/go-wails']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
            tags: ''
          - runner: windows-2022
            platform: windows
            arch: amd64
            tags: ''
          - runner: windows-11-arm
            platform: windows
            arch: arm64
            tags: ''
          - runner: ubuntu-22.04
            platform: linux
            arch: amd64
            tags: '-tags=gtk3'
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            tags: '-tags=gtk3'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOFLAGS: ${{ matrix.tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Frontend
        shell: bash
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Go checks
        shell: bash
        run: |
          test "$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)" = 'v3.0.0'
          test -z "$(gofmt -l cmd internal frontend/assets.go)"
          go vet ./...
          go test ./...
      - name: Race checks
        if: runner.os != 'Windows'
        run: go test -race ./internal/... ./cmd/mailfabrica-cli
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          desktop_flags='-s -w'
          if [ "$RUNNER_OS" = 'Windows' ]; then desktop_flags="$desktop_flags -H=windowsgui"; fi
          go build -trimpath -ldflags "$desktop_flags" -o "dist/mailfabrica${suffix}" ./cmd/mailfabrica
          go build -trimpath -o "dist/mailfabrica-cli${suffix}" ./cmd/mailfabrica-cli
      - name: End-to-end demo
        run: python3 scripts/smoke.py
      - name: Package
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mailfabrica-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/MailFabrica.app
            dist/*.zip
            dist/*.tar.gz
            dist/mailfabrica-cli*
