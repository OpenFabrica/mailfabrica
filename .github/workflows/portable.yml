name: Portable releases
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: master
      publish:
        description: Upload all four validated packages to an existing draft release
        type: boolean
        default: false
  push:
    tags: ['v*']
    branches: ['release/cross-platform']
permissions:
  contents: read
concurrency:
  group: portable-${{ inputs.ref || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: amd64
            flags: '-C target-feature=+crt-static'
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
            flags: '-C target-feature=+crt-static'
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: amd64
            flags: ''
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            flags: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.98.0-${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.flags }}
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONUTF8: '1'
      MAILFABRICA_RELEASE: ${{ (github.ref_type == 'tag' || inputs.publish) && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libudev-dev libgtk-3-dev libvulkan1 mesa-vulkan-drivers xvfb fonts-noto-cjk dbus-x11
      - name: Native Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc -vV
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: rust-${{ runner.os }}-${{ matrix.arch }}-
      - name: CI and native package
        shell: bash
        run: |
          cargo xtask ci
          cargo xtask package
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: success() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Windows packaged application QA
        if: runner.os == 'Windows'
        shell: bash
        run: python xtask/qa.py windows "${{ matrix.arch }}"
      - name: Linux packaged application QA
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export WGPU_BACKEND=vulkan
          xvfb-run -a -s '-screen 0 1280x900x24' python3 xtask/qa.py linux "${{ matrix.arch }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*/*.zip
            dist/*/*.tar.gz
            dist/*/*.sha256
            dist/*/*.json
            dist/qa/*
  upload:
    needs: build
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist/artifacts
          merge-multiple: true
      - name: Verify and upload portable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 xtask/upload.py
