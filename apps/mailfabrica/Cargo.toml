[package]
name = "mailfabrica"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "mailfabrica"
description = "MailFabrica desktop app"

[lints]
workspace = true

[dependencies]
mailfabrica-brand = { workspace = true }
mailfabrica-engine = { workspace = true }
mailfabrica-update = { workspace = true }
mailfabrica-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }

[build-dependencies]
mailfabrica-brand = { workspace = true }
winresource = "0.1.31"

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "=0.55.1", default-features = false, features = ["protocol"] }
mailfabrica-html = { workspace = true }
percent-encoding = "2"
image = { workspace = true }
