[package]
name = "mailfabrica-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MailFabrica engine: session, commands, view state, compose; the only API the UI, CLI and MCP use"

[lints]
workspace = true

[dependencies]
mailfabrica-core = { workspace = true }
mailfabrica-mime = { workspace = true }
mailfabrica-rich = { workspace = true }
mailfabrica-store = { workspace = true }
mailfabrica-sync = { workspace = true }
mailfabrica-update = { workspace = true }
mailfabrica-ai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }
