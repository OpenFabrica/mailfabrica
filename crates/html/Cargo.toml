[package]
name = "mailfabrica-html"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MailFabrica HTML mail renderer: blitz (Stylo + Taffy) layout, vello_cpu rasterized tiles, on a dedicated thread"

[lints]
workspace = true

[dependencies]
log = { workspace = true }
base64 = { workspace = true }
rustls = { workspace = true }
blitz-dom = { workspace = true }
blitz-html = { workspace = true }
blitz-paint = { workspace = true }
blitz-traits = { workspace = true }
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true }
parley = { workspace = true }
ureq = { workspace = true }
# 只为打开 blitz 解码图片需要的格式（blitz-dom 依赖 image 时关掉了全部默认格式）
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }

# 系统 WebView 的展示文档清洗；不改变 MIME 原文。
ammonia = "4.2.4"
html5ever = "0.40.1"
