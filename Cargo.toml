[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.6-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# internal
mailfabrica-brand = { path = "crates/brand" }
mailfabrica-core = { path = "crates/core" }
mailfabrica-mime = { path = "crates/mime" }
mailfabrica-rich = { path = "crates/rich" }
mailfabrica-proto = { path = "crates/proto" }
mailfabrica-store = { path = "crates/store" }
mailfabrica-sync = { path = "crates/sync" }
mailfabrica-update = { path = "crates/update" }
mailfabrica-ai = { path = "crates/ai" }
mailfabrica-html = { path = "crates/html" }
mailfabrica-engine = { path = "crates/engine" }
mailfabrica-ui-egui = { path = "crates/ui-egui" }
mailfabrica-mcp = { path = "crates/mcp" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
tempfile = "3"
semver = "1"
sha2 = "0.10"
tiny-skia = "0.12"
# 农历（日历视图的日期格子里显示"初六"、"九月"）
chinese-lunisolar-calendar = { version = "0.2", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

# mail
# aws-lc-rs 后端 + prefer-post-quantum：首次握手就带 X25519MLKEM768 密钥。有的邮件服务器只接受这个组，
# ring 后端不支持 ML-KEM，握手会被对方直接断开（"unexpected end of file"）
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12", "logging"] }
webpki-roots = "1"

# HTML 邮件渲染（blitz 还是 beta，钉死版本；anyrender 要和 blitz-paint 用的同一版）
blitz-dom = { version = "=0.3.0-beta.2", default-features = false, features = ["system-fonts", "complex-scripts", "svg", "woff", "floats"] }
blitz-html = "=0.3.0-beta.2"
blitz-paint = { version = "=0.3.0-beta.2", default-features = false, features = ["svg"] }
blitz-traits = "=0.3.0-beta.2"
anyrender = "0.13"
anyrender_vello_cpu = "0.17"
parley = { version = "0.11", default-features = false, features = ["system"] }
# 阻塞式 HTTP（加载邮件里的远程图片）；TLS 用上面同一个 rustls（aws-lc-rs 后端）
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }
mail-parser = "0.11"
mail-builder = "0.4"
html2text = "0.15"

# ui
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
