[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# internal
mailfabrica-core = { path = "crates/core" }
mailfabrica-mime = { path = "crates/mime" }
mailfabrica-rich = { path = "crates/rich" }
mailfabrica-proto = { path = "crates/proto" }
mailfabrica-store = { path = "crates/store" }
mailfabrica-sync = { path = "crates/sync" }
mailfabrica-engine = { path = "crates/engine" }
mailfabrica-ui-egui = { path = "crates/ui-egui" }
mailfabrica-mcp = { path = "crates/mcp" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
tempfile = "3"

# mail
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
mail-parser = "0.11"
mail-builder = "0.4"
html2text = "0.15"

# ui
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
